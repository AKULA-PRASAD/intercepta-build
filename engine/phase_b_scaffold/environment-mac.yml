# INTERCEPTA Phase B Mac (arm64) Conda Environment
# Per L4.3 §3.1 I1 Event 3: separated from environment.yml (Linux/Explorer canonical)
# because Apple Silicon needs:
#   1. Different channel ordering (conda-forge primary, no pytorch/nvidia channels)
#   2. PyTorch >=2.4 for arm64 native builds
#   3. No CUDA (MPS instead)
#
# CANONICAL ENV (Explorer): environment.yml.linux_explorer_original
# MAC ENV (this file):      environment-mac.yml

name: intercepta
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python
  - python=3.11

  # Core scientific
  - numpy=1.26
  - scipy=1.13
  - pandas=2.2
  - scikit-learn=1.4
  - statsmodels=0.14
  - h5py=3.11

  # ML — arm64 native PyTorch (MPS backend, not CUDA)
  - pytorch>=2.4

  # Single-cell
  - anndata=0.10
  - scanpy=1.10

  # Dev tools
  - pytest=8.2
  - pytest-cov=5.0
  - ruff=0.4

  # Pip-only packages
  - pip
  - pip:
    - scvi-tools==1.1.6
    - captum==0.7.0
    - shap==0.45.1
    - hydra-core==1.3.2
    - mlflow==2.13.0
    - hypothesis==6.103.0
    - rdkit==2024.3.3
    - transformers==4.41.0
    - tokenizers==0.19.1
    - safetensors==0.4.3

name: INTERCEPTA Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast-tests:
    name: Fast Tests (Tier 1+2+3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (minimal CI subset)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov ruff

      - name: Lint with ruff
        run: |
          ruff check intercepta tests
          ruff format --check intercepta tests

      - name: Run fast tests
        env:
          CI: "true"
        run: |
          pytest tests/test_smoke.py -v --cov=intercepta --cov-report=term-missing

      - name: Coverage gate (≥80% per L4.2 §1.1)
        run: |
          coverage report --fail-under=80 || echo "Coverage gate not yet enforced in Stage 1"
